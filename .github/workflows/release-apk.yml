name: Build Release APK

on:
  push:
    branches:
      - "master"
      - "codex/moonshine-vocabulary-beta"
      - "codex/s1-mini-beta"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing.jks
          printf 'storeFile=release-signing.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' \
            "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" "$RELEASE_STORE_PASSWORD" > keystore.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null

      - name: Build APK
        run: |
          ./gradlew :app:testStandaloneReleaseUnitTest :app:assembleStandaloneRelease
          echo "APK_DIR=app/build/outputs/apk/standalone/release" >> "$GITHUB_ENV"
          echo "APK_NAME=futo-voice-input-moonshine" >> "$GITHUB_ENV"

      - name: Verify APK contents and signature
        run: |
          APK_PATH="$(find app/build/outputs/apk/standalone/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          APK_LISTING="$(unzip -Z1 "$APK_PATH")"
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libs1mini.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libllama.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libggml-opencl.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libOpenCL.so'
          printf '%s\n' "$APK_LISTING" | grep -E '^lib/arm64-v8a/libggml-cpu.*\.so$'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK_PATH" \
            | grep -F 'android:extractNativeLibs="true"'
          if printf '%s\n' "$APK_LISTING" | grep -E '^lib/(armeabi|armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library found'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Rename APK
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME:-manual}"
          VERSION="${VERSION//\//-}"
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in $APK_DIR"
            exit 1
          fi
          cp "$APK_PATH" "release/${APK_NAME}-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-voice-input-moonshine-apk
          path: release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FUTO Voice Input Moonshine ${{ github.ref_name }}
          body: |
            ## Beta 8 highlights

            - Fixes Android discovery of the packaged llama.cpp CPU and OpenCL backend libraries.
            - Adds per-candidate benchmark failures, packaged libraries, and discovered devices to standard diagnostics.
            - Adds persistent opt-in transcript capture for eligible English S1-mini cleanup runs.
            - Keeps standard diagnostics transcript-free and adds a separately confirmed, clearly labeled transcript ZIP.
            - Adds transcript review, individual deletion, clear-all, ten-run retention, and seven-day expiry.

            ## What to test

            - Rerun the optimization test on a Galaxy S24+; it should select a valid CPU or OpenCL result.
            - Dictate English, press Stop, and confirm S1-mini changes the final transcript instead of falling back immediately.
            - Enable transcript capture, perform a cleanup run, and review all three labeled transcript stages.
            - Export both ZIP types and confirm only the `WITH-TRANSCRIPTS` archive contains dictated text.
            - Attach the new standard or transcript-inclusive ZIP with any failure or quality feedback.

            ## Known beta gaps

            - The backend-loader fix still needs validation on the target Galaxy S24+.
            - OpenCL support depends on the phone vendor's driver and automatically falls back to validated CPU inference.
            - Cleanup may return the raw transcript after a timeout, model/process failure, or memory pressure.
            - Release-level thermal, memory, long-transcript, and full backend regression testing remains in progress.

            ## Installation and models

            This is a signed standalone APK for the FUTO Voice Input fork. Moonshine remains the default offline recognizer; Parakeet, Nemotron, and legacy Whisper/GGML remain selectable in Model Options.

            Speech models and S1-mini weights are not bundled in the APK. Download the desired model on first use or from Model Options; transcription and cleanup remain offline after installation.

            The Parakeet integration and repository changes in this fork were built with AI assistance using Codex (GPT-5).
          files: release/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
