name: Build Release APK

on:
  push:
    branches:
      - "master"
      - "codex/moonshine-vocabulary-beta"
      - "codex/s1-mini-beta"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing.jks
          printf 'storeFile=release-signing.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' \
            "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" "$RELEASE_STORE_PASSWORD" > keystore.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null

      - name: Build APK
        run: |
          ./gradlew :app:testStandaloneReleaseUnitTest :app:assembleStandaloneRelease
          echo "APK_DIR=app/build/outputs/apk/standalone/release" >> "$GITHUB_ENV"
          echo "APK_NAME=futo-voice-input-moonshine" >> "$GITHUB_ENV"

      - name: Verify APK contents and signature
        run: |
          APK_PATH="$(find app/build/outputs/apk/standalone/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          APK_LISTING="$(unzip -Z1 "$APK_PATH")"
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libs1mini.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libllama.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libggml-opencl.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libOpenCL.so'
          printf '%s\n' "$APK_LISTING" | grep -E '^lib/arm64-v8a/libggml-cpu.*\.so$'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK_PATH" \
            | grep -F 'android:extractNativeLibs="true"'
          if printf '%s\n' "$APK_LISTING" | grep -E '^lib/(armeabi|armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library found'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Rename APK
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME:-manual}"
          VERSION="${VERSION//\//-}"
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in $APK_DIR"
            exit 1
          fi
          cp "$APK_PATH" "release/${APK_NAME}-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-voice-input-moonshine-apk
          path: release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FUTO Voice Input Moonshine ${{ github.ref_name }}
          body: |
            ## S1-mini English cleanup fix

            - Fixes S1-mini always skipping Orukeet because Orukeet does not report a detected language.
            - Enabled S1-mini cleanup now assumes English when the recognizer cannot identify the language.
            - Applies the same rule to Nemotron Auto-detect and Whisper with English enabled, while preserving explicit non-English bypasses.
            - Tests English eligibility and non-English bypasses across all six recognizers.
            - Retains all features and the archive-download fix from the stable Orukeet release.

            ## What to test

            - Keep Orukeet selected and S1-mini downloaded and enabled.
            - Dictate English and press Stop; cleanup should run instead of skipping for missing language metadata.
            - Existing downloaded models remain installed; no model download is required for this update.
            - Try the other English recognizers with S1-mini enabled.

            ## Known beta gaps

            - Orukeet supports 25 languages. Published accuracy gains are the authors' measurements, not Android benchmarks.
            - On-device S1-mini cleanup with Orukeet awaits phone testing; timeout and memory fallbacks still preserve the raw transcript.
            - Orukeet currently releases its recognizer after each dictation; Parakeet's keep-warm setting does not apply to it.
            - Use enabled S1-mini for English dictation. Unknown-language input is treated as English, not automatically language-detected.

            ## Installation and models

            This is a signed standalone arm64 APK for the FUTO Voice Input fork, with a higher version code for upgrading the current release.

            Speech models and S1-mini weights are not bundled in the APK. Download the desired model on first use or from Model Options; transcription and cleanup remain offline after installation.

            Model source: https://huggingface.co/oruk/orukeet
          files: release/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
