name: Build Release APK

on:
  push:
    branches:
      - "master"
      - "codex/moonshine-vocabulary-beta"
      - "codex/s1-mini-beta"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing.jks
          printf 'storeFile=release-signing.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' \
            "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" "$RELEASE_STORE_PASSWORD" > keystore.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null

      - name: Build APK
        run: |
          ./gradlew :app:testStandaloneReleaseUnitTest :app:assembleStandaloneRelease
          echo "APK_DIR=app/build/outputs/apk/standalone/release" >> "$GITHUB_ENV"
          echo "APK_NAME=futo-voice-input-moonshine" >> "$GITHUB_ENV"

      - name: Verify APK contents and signature
        run: |
          APK_PATH="$(find app/build/outputs/apk/standalone/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          APK_LISTING="$(unzip -Z1 "$APK_PATH")"
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libs1mini.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libllama.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libggml-opencl.so'
          printf '%s\n' "$APK_LISTING" | grep -Fx 'lib/arm64-v8a/libOpenCL.so'
          printf '%s\n' "$APK_LISTING" | grep -E '^lib/arm64-v8a/libggml-cpu.*\.so$'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK_PATH" \
            | grep -F 'android:extractNativeLibs="true"'
          if printf '%s\n' "$APK_LISTING" | grep -E '^lib/(armeabi|armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library found'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Rename APK
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME:-manual}"
          VERSION="${VERSION//\//-}"
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in $APK_DIR"
            exit 1
          fi
          cp "$APK_PATH" "release/${APK_NAME}-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-voice-input-moonshine-apk
          path: release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FUTO Voice Input Moonshine ${{ github.ref_name }}
          body: |
            ## Waveform and organized settings

            Built directly on v1.4.2-beta.16, retaining audio backups, history, retranscription, model downloads, and S1-mini cleanup.

            - Replace the pulsing recording circle with a scrolling four-second waveform from microphone samples. Tap anywhere on the recording surface to stop.
            - Group settings into Speech, Recording, Appearance, Support, Advanced, and About.
            - Move personal dictionary into its own Speech page and language controls into Languages.
            - Move stopping controls into Recording options and S1-mini runtime tuning into Advanced.
            - Move reports, transcript capture, and ZIP export into Support → Diagnostics, preserving transcript capture and export consent.

            ## What to test

            - Dictate from the keyboard and recognition activity. Confirm the waveform follows speech and silence and resets on the next recording.
            - Stop or cancel, then confirm audio history and retranscription still work.
            - Open the reorganized settings pages and confirm existing settings survive the update.
            - Export standard diagnostics and verify transcript export still asks for confirmation.

            All 95 unit tests, the standalone release build, and Android lint passed locally. Microphone capture and visual behavior still need phone testing.

            ## Installation

            Signed standalone arm64 APK, version code 52. Install over beta 16; models are not bundled.

            Audio lost before this update cannot be recovered. Backups begin with new recordings. Uninstalling the app or clearing its data deletes saved recordings.
          files: release/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
