name: Bug Report
description: Let us know about an unexpected error, a crash, or an incorrect behavior.
labels: ["needs-triage"]
title: "Bug: "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        # Thank you for taking the time to fill out this bug report.

        This tracker is for the [Today20092 Voice Input fork](https://github.com/Today20092/voice-input).

        For general usage questions, please see the [FUTO Keyboard Zulip Channel](https://chat.futo.org/#narrow/stream/53-Keyboard) or the [FUTO Keyboard Discord](https://keyboard.futo.org/discord)

        Please open bug reports one at a time. If you have 3 separate feature requests/bugs, do not combine them into one issue, this makes it really difficult to track and understand them.

        ## Filing a bug report

        To fix your issues faster, we need clear reproduction cases - ideally allowing us to make it happen locally.
        * Please include all needed context. For example, Device, OS, Application, any relevant settings.
        * If you've found a particular series of interactions can introduce buggy behavior, please label those steps 1-n with markdown

        If settings opens, go to Settings > Support > Diagnostics > Export bug report.
        Review the summary and any notes, then share the standard ZIP and attach it here.
        A downloaded recognition model or microphone permission is not needed to prepare a report.
        Detailed mode is optional for reproducing a problem; it does not recover evidence from before it was enabled.

        If the app cannot open or export fails, say so and provide the installed APK/version source,
        device, Android version, last working version if known, and reproduction steps below.
        If you cannot determine the app version, enter "unknown". An archive is optional.
        Do not attach raw Logcat, recordings, or exports labeled WITH-TRANSCRIPTS without reviewing their contents.

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Please provide us with the steps to reproduce the issue if possible. This step makes a big difference if we are going to be able to fix it so be as precise as possible.
      placeholder: |
        1. Open FUTO Voice Input application
        2. Go to "Testing Menu"
        3. Trigger voice input
        4. Application crashes
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual result
      description: What happened? Remove dictated text and personal information from any screenshots or video you choose to attach.
      placeholder: Tell us what you saw!
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What did you expect to happen?
      placeholder: Tell us what you expected to happen!
    validations:
      required: true

  - type: input
    id: voice-input-version
    attributes:
      label: Voice Input Version
      description: Enter the installed version or APK source. If the app cannot open and the version is unavailable, enter "unknown".
      placeholder: "1.3.5"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Which android version are you using?
      placeholder: "Android 15"
    validations:
      required: true

  - type: input
    id: phone-model
    attributes:
      label: Which device are you using?
      placeholder: "Google Pixel 9"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Which operating system are you using?
      placeholder: "GrapheneOS/CalyxOS/Tizen/HyperOS 2/..."
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Are there any other GitHub issues, whether open or closed, that are related to the problem you've described above? If so, please create a list below that mentions each of them. For example:
        ```
          - #10
          - #25
        ```
      placeholder:
      value:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Standard bug report or export failure
      description: Attach the reviewed standard diagnostic ZIP here, or explain why it is unavailable. Do not paste raw logs; they can contain vocabulary, paths, or exception messages. Do not include dictated text in your notes unless you intend to share it publicly.
    validations:
      required: false
