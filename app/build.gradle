class ModelFile {
    String name
    String sha256

    ModelFile(String name, String sha256) {
        this.name = name
        this.sha256 = sha256
    }
}

def parakeetModelFiles = [
        new ModelFile('encoder.int8.onnx', 'acfc2b4456377e15d04f0243af540b7fe7c992f8d898d751cf134c3a55fd2247'),
        new ModelFile('decoder.int8.onnx', '179e50c43d1a9de79c8a24149a2f9bac6eb5981823f2a2ed88d655b24248db4e'),
        new ModelFile('joiner.int8.onnx', '3164c13fc2821009440d20fcb5fdc78bff28b4db2f8d0f0b329101719c0948b3'),
        new ModelFile('tokens.txt', 'd58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d')
]

def huggingFaceRepo = 'https://huggingface.co/twmht/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/1247204e1cc87d84abf1c9a5e45c1caee15b314a'
String sha256(File file) {
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

tasks.register('downloadParakeetModels') {
    description = 'Download Hugging Face Parakeet model assets'
    group = 'build'

        def assetsDir = project.file('src/main/assets/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8')
    outputs.dir assetsDir
    outputs.upToDateWhen { false }

    doLast {
        assetsDir.mkdirs()
        parakeetModelFiles.each { model ->
            def destFile = new File(assetsDir, model.name)
            if (destFile.exists() && model.sha256) {
                def hash = sha256(destFile)
                if (hash == model.sha256) {
                    println "  ${model.name} already downloaded and verified"
                    return
                }
                println "  ${model.name} checksum mismatch, re-downloading"
                destFile.delete()
            }

            if (!destFile.exists()) {
                println "  Downloading ${model.name}"
                def downloadUrl = "${huggingFaceRepo}/${model.name}?download=true"
                def curlCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'curl.exe' : 'curl'
                exec {
                    commandLine curlCommand, '-L', '-f', '-o', destFile.absolutePath, downloadUrl
                }
            }

            if (model.sha256) {
                def hash = sha256(destFile)
                if (hash != model.sha256) {
                    throw new GradleException("Checksum verification failed for ${model.name}: expected ${model.sha256}, got ${hash}")
                }
                println "  ${model.name} verified"
            }
        }
    }
}

tasks.named('preBuild') {
    if (bundleParakeetModel) {
        dependsOn tasks.named('downloadParakeetModels')
    }
}

tasks.register('verifyDevDebugApk') {
    description = 'Build and verify the dev debug APK native packaging'
    group = 'verification'
    dependsOn tasks.named('assembleDevDebug')

    doLast {
        def apkDirectory = layout.buildDirectory.dir('outputs/apk/dev/debug').get().asFile
        def apks = apkDirectory.listFiles()?.findAll { it.name.endsWith('.apk') } ?: []
        if (apks.size() != 1) {
            throw new GradleException("Expected one dev debug APK in ${apkDirectory}, found ${apks.size()}")
        }

        def apk = apks[0]
        def nativeLibraryNames = { File archive ->
            def opened = new java.util.zip.ZipFile(archive)
            try {
                return opened.entries().findAll {
                    !it.directory && it.name.startsWith('lib/')
                }*.name.sort()
            } finally {
                opened.close()
            }
        }
        def nativeLibraries = nativeLibraryNames(apk)
        def unexpectedAbis = nativeLibraries.findAll { !it.startsWith('lib/arm64-v8a/') }
        if (unexpectedAbis) {
            throw new GradleException("Unexpected native ABIs: ${unexpectedAbis.join(', ')}")
        }
        if (nativeLibraries.count { it.endsWith('/libonnxruntime.so') } != 1) {
            throw new GradleException('Expected exactly one ONNX Runtime native library')
        }
        if (nativeLibraries.count { it.endsWith('/libsherpa-onnx-jni.so') } != 1) {
            throw new GradleException('Expected exactly one Sherpa-ONNX JNI library')
        }

        println "APK: ${apk.name}"
        println "Size: ${apk.length()} bytes"
        println "ABI: arm64-v8a"
        println "Native libraries (${nativeLibraries.size()}): ${nativeLibraries.collect { it.tokenize('/').last() }.join(', ')}"

        if (project.hasProperty('baselineApk')) {
            def baseline = file(project.property('baselineApk'))
            if (!baseline.isFile()) {
                throw new GradleException("Baseline APK not found: ${baseline}")
            }
            def baselineLibraries = nativeLibraryNames(baseline)
            println "Baseline size: ${baseline.length()} bytes"
            println "Size change: ${apk.length() - baseline.length()} bytes"
            println "Native libraries added: ${(nativeLibraries - baselineLibraries).join(', ') ?: 'none'}"
            println "Native libraries removed: ${(baselineLibraries - nativeLibraries).join(', ') ?: 'none'}"
        }
    }
}
