def bundleParakeetModel = project.hasProperty('bundleParakeetModel') &&
        project.property('bundleParakeetModel').toString().toBoolean()

def sherpaOnnxVersion = '1.13.4'
def sherpaOnnxAar = layout.buildDirectory.file("downloads/sherpa-onnx-static-link-onnxruntime-${sherpaOnnxVersion}.aar")
def downloadSherpaOnnx = tasks.register('downloadSherpaOnnx') {
    outputs.file sherpaOnnxAar
    doLast {
        def target = sherpaOnnxAar.get().asFile
        target.parentFile.mkdirs()
        if (!target.exists()) {
            new URL("https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaOnnxVersion}/${target.name}")
                .withInputStream { input -> target.withOutputStream { it << input } }
        }
        def expected = 'dc5ac19a28dee3bffc5e5a5d50cb6afa977703fc4a7ee535a308506990fdd295'
        def actual = sha256(target)
        if (actual != expected) {
            target.delete()
            throw new GradleException("Checksum verification failed for ${target.name}: expected ${expected}, got ${actual}")
        }
    }
}
def sherpaOnnxFiles = files(sherpaOnnxAar).builtBy(downloadSherpaOnnx)

def gitShortHash = {
    try {
        def output = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = output
        }
        return output.toString().trim()
    } catch (Exception ignored) {
        return 'nogit'
    }
}()

android {
    namespace 'org.futo.voiceinput'
    compileSdk 35

        defaultConfig {
        applicationId "org.futo.voiceinput"
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName "1.4.2-beta.4"
        buildConfigField "boolean", "BUNDLE_PARAKEET_MODEL", bundleParakeetModel.toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        externalNativeBuild {
            cmake {
                cppFlags '-O3'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    final def keystorePropertiesFile = rootProject.file("keystore.properties")
    def releaseSigning = signingConfigs.debug
    if (keystorePropertiesFile.exists()) {
        final def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        releaseSigning = signingConfigs.create("release") {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    } else {
    	project.logger.lifecycle('keystore.properties not found, APK may not be signed')
    }

    final def crashReportPropertiesFile = rootProject.file("crashreporting.properties")
    final def crashReportProperties = new Properties()
    if (crashReportPropertiesFile.exists()) {
        crashReportProperties.load(new FileInputStream(crashReportPropertiesFile))
    } else {
        project.logger.lifecycle('crashreporting.properties not found, crash reporting will be disabled')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseSigning
        }

        buildTypes.each {
            if (crashReportPropertiesFile.exists()) {
                it.buildConfigField "boolean", "ENABLE_ACRA", crashReportProperties['acraEnabled']
                it.buildConfigField "String", "ACRA_URL", crashReportProperties['acraUrl']
                it.buildConfigField "String", "ACRA_USER", crashReportProperties['acraUser']
                it.buildConfigField "String", "ACRA_PASSWORD", crashReportProperties['acraPassword']
            } else {
                it.buildConfigField "boolean", "ENABLE_ACRA", "false"
                it.buildConfigField "String", "ACRA_URL", "null"
                it.buildConfigField "String", "ACRA_USER", "null"
                it.buildConfigField "String", "ACRA_PASSWORD", "null"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lint {
        // Compose's detector crashes under this project's Kotlin/UAST versions.
        disable 'MutableCollectionMutableState'
    }
    buildFeatures {
        buildConfig true
        compose true
        viewBinding true
        mlModelBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.6'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging false
            keepDebugSymbols += '**/*.so'
        }
    }

    flavorDimensions "version"
    productFlavors {
        playStore {
            dimension "version"
        }

        standalone {
            dimension "version"
            applicationIdSuffix ".moonshine"
            versionNameSuffix "-moonshine"
        }

        fDroid {
            dimension "version"
        }

        dev {
            dimension "version"
            versionNameSuffix "-dev"
            applicationIdSuffix ".dev"
        }

        devSameId {
            dimension "version"
            versionNameSuffix "-devSameId"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs 'src/main/jniLibs'
        }

        dev {
            // Include update checking for testing
            java.srcDir 'src/withUpdateChecking/java'

            // Include only the payments directories, not the dummy directories, to compile both billing methods
            java.srcDir 'src/playStoreBilling/java/org/futo/voiceinput/payments'
            java.srcDir 'src/payPalBilling/java/org/futo/voiceinput/payments'
            res.srcDir 'src/payPalBilling/res'

            // Include dev code
            java.srcDir 'src/dev/java'
        }

        devSameId {
            // Include update checking for testing
            java.srcDir 'src/withUpdateChecking/java'

            // Include only the payments directories, not the dummy directories, to compile both billing methods
            java.srcDir 'src/playStoreBilling/java/org/futo/voiceinput/payments'
            java.srcDir 'src/payPalBilling/java/org/futo/voiceinput/payments'
            res.srcDir 'src/payPalBilling/res'

            // Include dev code
            java.srcDir 'src/dev/java'
        }

        playStore {
            // Updates are handled by Play Store
            java.srcDir 'src/withoutUpdateChecking/java'

            // Include only Play Store billing
            java.srcDir 'src/playStoreBilling/java'

            // Include non-dev code
            java.srcDir 'src/nonDev/java'
        }

        fDroid {
            // Updates are handled by F-Droid
            java.srcDir 'src/withoutUpdateChecking/java'

            // Include only PayPal billing, do not depend on Play Store billing
            java.srcDir 'src/payPalBilling/java'
            res.srcDir 'src/payPalBilling/res'

            // Include non-dev code
            java.srcDir 'src/nonDev/java'
        }

        standalone {
            // It is our responsibility to handle updates
            java.srcDir 'src/withUpdateChecking/java'

            // Include only PayPal billing, do not depend on Play Store billing
            java.srcDir 'src/payPalBilling/java'
            res.srcDir 'src/payPalBilling/res'

            // Include non-dev code
            java.srcDir 'src/nonDev/java'
        }
    }

    ndkVersion '28.2.13676358'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        def appSlug = "futo-voice-input-moonshine"
        def flavor = variant.flavorName ?: "unflavored"
        def version = variant.versionName.replaceAll(/[^A-Za-z0-9._-]/, "-")
        def buildType = variant.buildType.name
        outputFileName = "${appSlug}-${flavor}-v${version}-${gitShortHash}-${buildType}.apk"
    }
}

