[package]
name = "harper_android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
harper-core = { git = "https://github.com/Automattic/harper", rev = "c821f511f83c24401993e207f7e5cdb51ae872e6", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = "thin"
panic = "unwind"

